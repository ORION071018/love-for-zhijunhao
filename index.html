<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>致智俊豪 · 我会一直在你身边</title>
  <style>
    /* 基础重置与浅蓝氛围 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #e3f2fd 0%, #bbdefb 50%, #e1f5fe 100%);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* 飘浮的小元素背景 */
    .floating-item {
      position: fixed;
      pointer-events: none;
      font-size: 1.4rem;
      opacity: 0.4;
      animation: floatUp 10s infinite ease-in-out;
      z-index: 1;
      user-select: none;
      color: #64b5f6;
      filter: drop-shadow(0 0 5px rgba(100, 181, 246, 0.3));
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
      50% { transform: translateY(-40px) rotate(10deg); opacity: 0.5; }
      100% { transform: translateY(-100px) rotate(-5deg); opacity: 0; }
    }

    /* ================= 验证页面 ================= */
    .gate-page {
      position: relative;
      z-index: 20;
      max-width: 500px;
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 48px;
      padding: 3rem 2rem;
      box-shadow: 0 30px 50px rgba(100, 150, 220, 0.3),
                  0 10px 25px rgba(80, 130, 200, 0.2),
                  inset 0 0 40px rgba(210, 235, 255, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.9);
      text-align: center;
      animation: breathe 6s infinite alternate;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    @keyframes breathe {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.01) translateY(-6px); }
    }

    .gate-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      animation: heartBeat 1.4s infinite ease-in-out;
      display: inline-block;
      filter: drop-shadow(0 8px 12px rgba(70, 130, 200, 0.3));
    }

    @keyframes heartBeat {
      0% { transform: scale(1); }
      30% { transform: scale(1.15); }
      50% { transform: scale(0.95); }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .gate-title {
      font-size: clamp(1.5rem, 6vw, 2rem);
      font-weight: 800;
      color: #1565c0;
      letter-spacing: 3px;
      margin-bottom: 2rem;
      text-shadow: 2px 2px 0 #b3d9ff;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .birthday-input {
      width: 100%;
      padding: 1.1rem 1.5rem;
      font-size: 1.1rem;
      border: 2px solid #90caf9;
      border-radius: 60px;
      background: rgba(255, 255, 255, 0.9);
      color: #0d47a1;
      outline: none;
      text-align: center;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      font-family: inherit;
      font-weight: 500;
    }

    .birthday-input::placeholder {
      color: #90a4ae;
      letter-spacing: 1px;
      font-weight: 400;
    }

    .birthday-input:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 4px rgba(25, 118, 210, 0.15),
                  0 8px 20px rgba(25, 118, 210, 0.2);
      transform: translateY(-2px);
    }

    .confirm-btn {
      width: 100%;
      padding: 1.1rem 1.5rem;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: white;
      background: linear-gradient(145deg, #42a5f5, #1976d2);
      border: none;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(25, 118, 210, 0.35),
                  inset 0 2px 5px rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .confirm-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(25, 118, 210, 0.45),
                  inset 0 2px 5px rgba(255, 255, 255, 0.3);
    }

    .confirm-btn:active {
      transform: translateY(-1px) scale(0.98);
    }

    /* ================= 主内容页 ================= */
    .love-page {
      position: relative;
      z-index: 10;
      max-width: 750px;
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 56px;
      padding: 3rem 2rem;
      box-shadow: 0 30px 50px rgba(100, 150, 220, 0.25),
                  0 10px 25px rgba(80, 130, 200, 0.2),
                  inset 0 0 40px rgba(210, 235, 255, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.8);
      text-align: center;
      animation: breathe 6s infinite alternate;
      display: none;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .love-page.show {
      display: block;
      opacity: 1;
      transform: scale(1);
    }

    .main-title {
      font-size: clamp(2.4rem, 11vw, 4.8rem);
      font-weight: 800;
      letter-spacing: 5px;
      color: #1565c0;
      text-shadow: 3px 3px 0 #b3d9ff,
                   6px 6px 15px rgba(70, 130, 200, 0.3);
      margin-bottom: 0.5rem;
      line-height: 1.2;
      word-break: break-word;
      animation: titleGlow 2s infinite alternate;
    }

    @keyframes titleGlow {
      0% { text-shadow: 3px 3px 0 #b3d9ff, 6px 6px 15px rgba(70, 130, 200, 0.2); }
      100% { text-shadow: 5px 5px 0 #a0cfff, 10px 10px 25px rgba(50, 110, 190, 0.5); }
    }

    .sub-message {
      font-size: clamp(1.1rem, 4.5vw, 1.5rem);
      color: #1976d2;
      font-weight: 400;
      letter-spacing: 2px;
      margin-bottom: 2rem;
      opacity: 0.9;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .sub-message span { font-size: 1.6rem; color: #42a5f5; }

    .heart-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.2rem;
      margin: 1.8rem 0 2rem;
      flex-wrap: wrap;
    }

    .big-heart {
      font-size: clamp(3rem, 14vw, 5.5rem);
      line-height: 1;
      filter: drop-shadow(0 8px 12px rgba(70, 130, 200, 0.3));
      animation: heartBeat 1.4s infinite ease-in-out;
      transform-origin: center;
      display: inline-block;
      transition: transform 0.2s;
      cursor: default;
    }

    .big-heart:nth-child(2) { animation-delay: 0.2s; font-size: clamp(3.8rem, 17vw, 6.5rem); }
    .big-heart:nth-child(3) { animation-delay: 0.4s; }

    .love-note {
      background: rgba(225, 240, 255, 0.8);
      border-radius: 40px;
      padding: 1.8rem 1.8rem;
      margin: 2rem 0 1.5rem;
      border: 2px dashed #90caf9;
      box-shadow: inset 0 2px 12px #ffffff, 0 10px 20px rgba(100, 150, 220, 0.15);
    }

    .love-note p {
      font-size: clamp(1.05rem, 4.2vw, 1.35rem);
      line-height: 1.8;
      color: #1e3a5f;
      font-weight: 500;
      letter-spacing: 0.5px;
      word-break: break-word;
    }

    .love-note p + p { margin-top: 0.6rem; }

    .highlight-line {
      font-size: clamp(1.1rem, 4.6vw, 1.5rem) !important;
      font-weight: 700 !important;
      color: #0d47a1 !important;
      background: linear-gradient(145deg, #e3f2fd, #bbdefb);
      padding: 0.9rem 1.4rem;
      border-radius: 40px;
      margin-top: 1rem;
      border-left: 6px solid #1976d2;
      border-right: 6px solid #1976d2;
      box-shadow: 0 4px 12px rgba(30, 100, 180, 0.2);
      letter-spacing: 1px;
      line-height: 1.6;
    }

    .daily-love {
      margin-top: 1.2rem;
      font-size: clamp(1rem, 4vw, 1.2rem);
      color: #1565c0;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(200, 225, 250, 0.7);
      padding: 0.7rem 1.6rem;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .sparkle {
      position: absolute;
      color: #64b5f6;
      font-size: 1.2rem;
      animation: twinkle 2s infinite;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .footer-note {
      margin-top: 1.8rem;
      font-size: 0.9rem;
      color: #5a8fbb;
      letter-spacing: 2px;
    }

    /* 点击小爱心效果 */
    .click-heart {
      position: fixed;
      pointer-events: none;
      font-size: 1.8rem;
      animation: popUp 0.7s ease-out forwards;
      z-index: 999;
    }

    @keyframes popUp {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
      100% { opacity: 0; transform: translate(-50%, -150%) scale(1.6); }
    }

    /* ================= 成功弹窗 ================= */
    .success-modal {
      position: fixed;
      inset: 0;
      background: rgba(30, 60, 100, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 1.5rem;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .success-modal.show {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      max-width: 420px;
      width: 100%;
      background: linear-gradient(160deg, #ffffff, #e3f2fd);
      border-radius: 48px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 30px 60px rgba(20, 60, 120, 0.35),
                  0 0 0 6px rgba(255, 255, 255, 0.6);
      border: 2px solid white;
      transform: scale(0.8);
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .success-modal.show .modal-content {
      transform: scale(1);
    }

    .modal-emoji {
      font-size: 4rem;
      margin-bottom: 0.8rem;
      display: inline-block;
      animation: heartBeat 1.2s infinite ease-in-out;
    }

    .modal-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #0d47a1;
      letter-spacing: 3px;
      margin-bottom: 1rem;
    }

    .modal-text {
      font-size: 1.2rem;
      color: #1565c0;
      font-weight: 600;
      line-height: 1.8;
      letter-spacing: 1px;
      margin-bottom: 1.8rem;
      background: rgba(255, 255, 255, 0.8);
      padding: 1.2rem;
      border-radius: 30px;
      border: 2px dashed #90caf9;
    }

    .modal-text strong {
      color: #d32f2f;
      font-size: 1.35rem;
    }

    .modal-btn {
      padding: 0.9rem 2.2rem;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: white;
      background: linear-gradient(145deg, #42a5f5, #1976d2);
      border: none;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(25, 118, 210, 0.35);
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .modal-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(25, 118, 210, 0.45);
    }

    .modal-btn:active {
      transform: translateY(-1px) scale(0.98);
    }

    /* 抖动动画 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    /* 响应式 */
    @media (max-width: 480px) {
      .love-page, .gate-page {
        padding: 2rem 1.2rem;
        border-radius: 40px;
      }
      .heart-container { gap: 0.5rem; }
      .love-note { padding: 1.2rem 1rem; }
      .highlight-line { padding: 0.7rem 1rem; font-size: 1rem !important; }
      .gate-title { font-size: 1.3rem; }
      .modal-content { padding: 1.8rem 1.2rem; }
      .modal-text { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <!-- 飘浮的浅蓝装饰背景 -->
  <div id="floatingContainer"></div>

  <!-- ================= 验证页面 ================= -->
  <div class="gate-page" id="gatePage">
    <div class="gate-icon">💙</div>
    <h2 class="gate-title">输入我的生日</h2>

    <div class="input-group">
      <input 
        type="text" 
        id="birthdayInput" 
        class="birthday-input" 
        placeholder=""
        autocomplete="off"
      >
      <button class="confirm-btn" id="confirmBtn">确认 💌</button>
    </div>
  </div>

  <!-- ================= 主内容页 ================= -->
  <div class="love-page" id="lovePage">
    <div class="sparkle" style="top: 6%; left: 6%;">✨</div>
    <div class="sparkle" style="top: 12%; right: 8%; animation-delay: 0.5s;">✨</div>
    <div class="sparkle" style="bottom: 10%; left: 12%; animation-delay: 1s;">✨</div>
    <div class="sparkle" style="bottom: 18%; right: 10%; animation-delay: 1.8s;">✨</div>

    <h1 class="main-title">宝宝我爱你</h1>
    
    <div class="sub-message">
      <span>💙</span> 只对智俊豪说的悄悄话 <span>💙</span>
    </div>

    <div class="heart-container">
      <div class="big-heart" title="爱心">💙</div>
      <div class="big-heart" title="爱心">💖</div>
      <div class="big-heart" title="爱心">💙</div>
    </div>

    <div class="love-note">
      <p>You are my only</p>
      <p>You are my life</p>
      <p>I will love you forever</p>
      <p class="highlight-line">无论是宝宝还是弟弟或者是狗狗<br>我都会陪在智俊豪身边</p>
    </div>

    <div class="daily-love">
      <span>🌊</span> 每一天都比昨天更爱你 <span>🌊</span>
    </div>

    <div class="footer-note">
      —— 永远爱你的我 ——
    </div>
  </div>

  <!-- ================= 成功弹窗 ================= -->
  <div class="success-modal" id="successModal">
    <div class="modal-content">
      <div class="modal-emoji">🎉</div>
      <h3 class="modal-title">验证成功！</h3>
      <p class="modal-text">
        没错，你就是我最爱的智俊豪～<br>
        <strong>凭此截图，可以咬一口屁股！</strong>
      </p>
      <button class="modal-btn" id="closeModalBtn">嘿嘿，收下啦 💙</button>
    </div>
  </div>

  <script>
    (function() {
      // ===== 飘浮背景装饰 =====
      const floatingContainer = document.getElementById('floatingContainer');
      const symbols = ['💙', '💎', '🫧', '✨', '🌊', '💠', '🔹', '🐋', '❄️', '☁️'];
      const FLOAT_COUNT = 22;

      for (let i = 0; i < FLOAT_COUNT; i++) {
        const item = document.createElement('div');
        item.className = 'floating-item';
        item.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        item.style.left = Math.random() * 100 + '%';
        item.style.top = Math.random() * 100 + '%';
        item.style.fontSize = (0.8 + Math.random() * 1.8) + 'rem';
        item.style.animation = `floatUp ${6 + Math.random() * 12}s infinite ease-in-out`;
        item.style.animationDelay = Math.random() * 8 + 's';
        item.style.opacity = 0.2 + Math.random() * 0.3;
        floatingContainer.appendChild(item);
      }

      // ===== 点击弹出小爱心 =====
      document.body.addEventListener('click', function(e) {
        const clickHeart = document.createElement('div');
        clickHeart.className = 'click-heart';
        const heartSymbols = ['💙', '💖', '🩵', '💎', '✨', '🌊'];
        clickHeart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        clickHeart.style.left = e.clientX + 'px';
        clickHeart.style.top = e.clientY + 'px';
        clickHeart.style.fontSize = (1.2 + Math.random() * 1.2) + 'rem';
        document.body.appendChild(clickHeart);
        setTimeout(() => { if (clickHeart.parentNode) clickHeart.remove(); }, 700);
      });

      // ===== 生日验证逻辑 =====
      const gatePage = document.getElementById('gatePage');
      const lovePage = document.getElementById('lovePage');
      const birthdayInput = document.getElementById('birthdayInput');
      const confirmBtn = document.getElementById('confirmBtn');
      const successModal = document.getElementById('successModal');
      const closeModalBtn = document.getElementById('closeModalBtn');

      // 正确的生日格式（统一清洗后匹配）
      const correctAnswers = [
        '九月八日',
        '9月8日',
        '9月八日',
        '九月8日',
        '9.8',
        '9-8',
        '0908',
        '9/8',
        '9月8号',
        '九月八号'
      ];

      // 清洗输入：去掉空格、标点统一
      function cleanInput(str) {
        return str
          .trim()
          .replace(/\s+/g, '')
          .replace(/[。，,、\.\-\/]/g, '')
          .toLowerCase();
      }

      // 判断是否匹配
      function isValidBirthday(input) {
        const cleaned = cleanInput(input);
        const validCleaned = correctAnswers.map(a => cleanInput(a));
        if (validCleaned.includes(cleaned)) return true;

        // 宽松匹配：包含"九"和"八"，或者包含"9"和"8"
        const hasNine = /九|9/.test(cleaned);
        const hasEight = /八|8/.test(cleaned);
        if (cleaned.length <= 6 && hasNine && hasEight) return true;

        return false;
      }

      // 执行验证
      function verify() {
        const value = birthdayInput.value;
        if (!value.trim()) {
          birthdayInput.focus();
          return;
        }

        if (isValidBirthday(value)) {
          // 验证成功
          birthdayInput.blur();
          
          gatePage.style.opacity = '0';
          gatePage.style.transform = 'scale(0.9)';
          setTimeout(() => {
            gatePage.style.display = 'none';
            lovePage.classList.add('show');
            setTimeout(() => {
              successModal.classList.add('show');
            }, 500);
          }, 400);
        } else {
          // 验证失败，只抖动，无任何提示
          birthdayInput.value = '';
          birthdayInput.focus();
          birthdayInput.style.animation = 'none';
          setTimeout(() => {
            birthdayInput.style.animation = 'shake 0.5s';
          }, 10);
        }
      }

      // 绑定事件
      confirmBtn.addEventListener('click', verify);
      birthdayInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') verify();
      });

      // 关闭弹窗
      closeModalBtn.addEventListener('click', function() {
        successModal.classList.remove('show');
      });

      successModal.addEventListener('click', function(e) {
        if (e.target === successModal) {
          successModal.classList.remove('show');
        }
      });

      // 主标题点击跳动（保留）
      const mainTitle = document.querySelector('.main-title');
      if (mainTitle) {
        mainTitle.addEventListener('click', function() {
          const bigHearts = document.querySelectorAll('.big-heart');
          bigHearts.forEach((heart) => {
            heart.style.animationDuration = '0.6s';
            setTimeout(() => { heart.style.animationDuration = '1.4s'; }, 1000);
          });
        });
      }
    })();
  </script>
</body>
</html>
